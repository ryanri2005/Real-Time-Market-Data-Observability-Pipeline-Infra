apiVersion: apps/v1
kind: Deployment

metadata:
  name: market-data-ingestion
  labels:
    app: market-data-ingestion

spec:
  replicas: 1

  selector:
    matchLabels:
      app: market-data-ingestion

  template:
    metadata:
      labels:
        app: market-data-ingestion

    spec:
      terminationGracePeriodSeconds: 15

      containers:
        - name: ingestion
          image: real-time-market-data:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
