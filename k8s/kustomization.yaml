
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - prometheus-config.yaml
  - prometheus.yaml
  - grafana.yaml

configMapGenerator:
  - name: grafana-dashboard
    files:
      - market-data-dashboard.json

generatorOptions:
  disableNameSuffixHash: true
